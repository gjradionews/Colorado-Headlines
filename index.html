<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colorado News Desk</title>
<style>
:root{--navy:#111a2b;--red:#c82222;--ink:#0c1524;--muted:#53657f;--line:#d6dce4;--soft:#eef1f5;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.app{width:min(1180px,100%);margin:auto;background:#fff;min-height:100vh}.mast{background:var(--navy);color:#fff;border-bottom:4px solid var(--red);padding:12px 20px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.title{font-size:2rem;font-weight:900;letter-spacing:.01em}.sub{font-size:1rem;margin-top:3px}.count{text-align:right}.count strong{font-size:1.35rem}.count div{font-size:.92rem;margin-top:2px}.toolbar{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.toolbar button{background:#fff;border:1px solid #b8c0ca;padding:7px 11px;font-weight:800;cursor:pointer}.toolbar button.active{background:var(--navy);color:#fff}.searchbar{padding:12px 18px;display:grid;grid-template-columns:1fr 180px;gap:8px;border-bottom:3px solid var(--navy)}input,select{width:100%;padding:9px 10px;border:1px solid #aeb7c2;font:inherit}.region{border-bottom:1px solid var(--line)}.region-title{margin:0;padding:9px 18px;background:#d9dde3;font-size:1.04rem;font-weight:900;text-transform:uppercase;letter-spacing:.02em}.source{border-top:1px solid #cfd5dc}.source:first-of-type{border-top:0}.source-name{margin:0;padding:10px 20px 7px;background:#edf0f4;font-size:1.08rem;font-weight:900}.story{padding:11px 20px 12px;border-top:1px solid #e0e4e9}.story:first-child{border-top:0}.meta{font-size:.72rem;color:#466184;text-transform:uppercase;margin-bottom:4px}.headline{font-size:1.08rem;font-weight:800;line-height:1.23;margin:0 0 6px}.headline a{color:var(--ink);text-decoration:none}.headline a:hover{text-decoration:underline}.actions{font-size:.7rem;font-weight:800}.actions a,.actions button{border:0;background:none;color:#173864;padding:0;margin-right:12px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}.empty{padding:12px 20px;color:var(--muted);font-size:.9rem}.hidden{display:none!important}.western .source-name{background:#e6ebf2}.western .headline{font-size:1.12rem}.compact .story{padding-top:8px;padding-bottom:8px}.compact .headline{font-size:1rem}.loading{padding:24px;color:var(--muted)}@media(max-width:700px){.mast{padding:12px 14px}.title{font-size:1.55rem}.searchbar{grid-template-columns:1fr}.toolbar,.searchbar{padding-left:12px;padding-right:12px}.source-name,.story,.region-title{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<div class="app">
  <header class="mast">
    <div><div class="title">COLORADO NEWS DESK</div><div class="sub">Private Western Colorado newsroom dashboard</div></div>
    <div class="count"><strong><span id="headline-count">0</span></strong> headlines<div>Updated <span id="updated">—</span></div></div>
  </header>
  <nav class="toolbar" aria-label="View controls">
    <button data-view="latest">LATEST</button>
    <button data-view="source" class="active">BY SOURCE</button>
    <button data-view="unseen">NEW / UNSEEN</button>
    <button id="refresh-btn">REFRESH</button>
  </nav>
  <div class="searchbar">
    <input id="search" type="search" placeholder="Search headlines, sources, places…">
    <select id="region-filter"><option value="all">All</option><option>Western Slope</option><option>Statewide</option><option>Front Range</option><option>Mountains</option></select>
  </div>
  <main id="headlines" class="loading">Loading Colorado headlines…</main>
</div>
<script src="script.js"></script>
</body>
</html>
