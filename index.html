<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colorado News Desk</title>
<style>
:root{--bg:#0b0f14;--panel:#121821;--panel2:#171f2a;--text:#edf2f7;--muted:#9aa8b8;--line:#273241;--accent:#69a7ff;--chip:#192331}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.45}.shell{width:min(1260px,calc(100% - 28px));margin:auto}header{position:sticky;top:0;z-index:20;background:rgba(11,15,20,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}.top{padding:18px 0 12px;display:flex;align-items:end;justify-content:space-between;gap:18px}.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800}h1{margin:3px 0 0;font-size:clamp(1.9rem,3vw,2.7rem);line-height:1}.updated{color:var(--muted);font-size:.88rem;white-space:nowrap}.filters{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px}.filter{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:999px;padding:7px 12px;font:inherit;font-size:.86rem;font-weight:800;cursor:pointer;white-space:nowrap}.filter.active,.filter:hover{background:var(--accent);color:#07111f;border-color:var(--accent)}main{padding:22px 0 50px}.region{margin-bottom:34px}.region-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.region-title{margin:0;font-size:1.15rem;letter-spacing:.08em;text-transform:uppercase}.region-head:after{content:"";height:1px;background:var(--line);flex:1}.source-group{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:0 0 12px;overflow:hidden}.source-name{margin:0;padding:14px 16px 11px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:clamp(1.3rem,2vw,1.65rem);font-weight:900}.headline-list{list-style:none;margin:0;padding:0 16px}.headline-list li{padding:11px 0;border-top:1px solid var(--line)}.headline-list li:first-child{border-top:0}.headline-list a{color:var(--text);text-decoration:none;font-weight:700}.headline-list a:hover{color:var(--accent);text-decoration:underline}.story-time,.status{font-size:.8rem;color:var(--muted);margin-top:3px}.status{padding:14px 16px}.loading{color:var(--muted)}.hidden{display:none!important}@media(max-width:640px){.shell{width:min(100% - 18px,1260px)}.top{align-items:start;flex-direction:column;gap:6px}.updated{white-space:normal}.source-name{padding:13px 13px 10px}.headline-list{padding:0 13px}}
</style>
</head>
<body>
<header><div class="shell"><div class="top"><div><div class="eyebrow">Western Colorado newsroom monitor</div><h1>Colorado News Desk</h1></div><div class="updated">Last updated: <span id="date">—</span></div></div><div class="filters" aria-label="News filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="Western Slope">Western Slope</button><button class="filter" data-filter="Statewide">Statewide</button><button class="filter" data-filter="Front Range">Front Range</button><button class="filter" data-filter="Mountains">Mountains</button></div></div></header>
<main class="shell"><div id="headlines" class="loading">Loading Colorado headlines…</div></main>
<script src="script.js"></script>
</body>
</html>
