<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colorado News Desk</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #172033;
      --muted: #687386;
      --line: #dfe4ea;
      --accent: #245ea8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11151d;
        --card: #1a202b;
        --text: #eef3f8;
        --muted: #aab4c2;
        --line: #303846;
        --accent: #8bbcff;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }

    header {
      padding: 24px 20px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .wrap {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 3vw, 2.35rem);
      line-height: 1.1;
    }

    .updated {
      margin: 7px 0 12px;
      color: var(--muted);
      font-size: .92rem;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav a {
      text-decoration: none;
      color: var(--accent);
      font-weight: 700;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg);
    }

    main { padding: 22px 0 48px; }

    .region {
      margin: 0 0 30px;
    }

    .region-title {
      margin: 0 0 12px;
      font-size: 1.45rem;
      border-bottom: 2px solid var(--line);
      padding-bottom: 7px;
    }

    .source-group {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px 10px;
      margin: 0 0 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }

    /* Requested change: make source names noticeably larger. */
    .source-name {
      margin: 0 0 8px;
      font-size: clamp(1.18rem, 2vw, 1.4rem);
      font-weight: 800;
      letter-spacing: .01em;
    }

    .headline-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .headline-list li {
      padding: 9px 0;
      border-top: 1px solid var(--line);
    }

    .headline-list li:first-child { border-top: 0; }

    .headline-list a {
      color: var(--text);
      text-decoration: none;
      font-weight: 650;
    }

    .headline-list a:hover,
    .headline-list a:focus {
      color: var(--accent);
      text-decoration: underline;
    }

    .story-time,
    .status {
      color: var(--muted);
      font-size: .82rem;
      margin-top: 3px;
    }

    .loading {
      color: var(--muted);
      padding: 10px 0;
    }

    @media (max-width: 640px) {
      header { padding: 18px 12px 12px; }
      .wrap { width: min(100% - 20px, 1180px); }
      .source-group { padding: 14px 14px 8px; }
      .headline-list li { padding: 11px 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Colorado News Desk</h1>
      <p class="updated">Last updated: <span id="date">—</span></p>
      <nav class="nav" aria-label="News regions">
        <a href="#statewide">Statewide</a>
        <a href="#front-range">Front Range</a>
        <a href="#western-slope">Western Slope</a>
        <a href="#mountains">Mountains</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div id="headlines" class="loading">Loading Colorado headlines…</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
